server:
  port: 8080 # Cổng mặc định của API Gateway

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: api-gateway
    
  cloud:
    gateway:
      # 1. Cấu hình CORS tập trung tại Gateway
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:3000" # URL của frontend React/Vue
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            
      # 2. Cấu hình Routing (Điều hướng request)
      routes:
        # Route cho Auth Service (Xử lý đăng nhập, cấp token)
        - id: auth-service
          uri: lb://auth-service 
          predicates:
            - Path=/api/v1/auth/**
            
        - id: auth-users
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/users/**

        - id: auth-roles
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/roles/**

        # Route cho Maintenance Service (Dịch vụ bảo dưỡng)
        - id: maintenance-service
          uri: lb://maintenance-service # Sử dụng load balancer của Eureka
          predicates:
            - Path=/api/maintenance/**
            
        # Route cho Customer Service (Khách hàng)
        - id: customer-service
          uri: lb://customer-service # Sử dụng load balancer của Eureka
          predicates:
            - Path=/api/customers/**

        # Route cho Payment Service (Thanh toán)
        - id: payment-service
          uri: lb://payment-service # Sử dụng load balancer của Eureka
          predicates:
            - Path=/api/payments/**

        # Route cho Vehicle Service (Xe điện)
        - id: vehicle-service
          uri: lb://vehicle-service # Sử dụng load balancer của Eureka
          predicates:
            - Path=/api/vehicles/**

        # Route cho Notification Service (Thông báo)
        - id: notification-service
          uri: lb://notification-service # Sử dụng load balancer của Eureka
          predicates:
            - Path=/api/notifications/**

        # Route cho Chatbot Service (Trợ lý ảo)
        - id: chatbot-service
          uri: lb://chatbot-service # Sử dụng load balancer của Eureka
          predicates:
            - Path=/api/chatbots/**

        # Route cho Appointment Service (Đặt lịch hẹn)
        - id: appointment-service
          uri: lb://appointment-service # Sử dụng load balancer của Eureka
          predicates:
            - Path=/api/appointments/**

# Cấu hình hiển thị log để dễ debug khi cấu hình route sai
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Thêm khối này vào file application.yml của Gateway
jwt:
  secret: ${JWT_SECRET}