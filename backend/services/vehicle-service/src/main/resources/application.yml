server:
  port: 8082

spring:
  application:
    name: vehicle-service
  datasource:
    url: {{DATABASE_URL}}
    username: {{DATABASE_USERNAME}}
    password: {{DATABASE_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/